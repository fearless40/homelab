---
all:
  vars:
    vms:
      # Dynamic lease (no MAC/IP -> skipped by Kea role)
      - name: "web-01"
        group: "webservers"

      # Static Kea reservation
      - name: "web-02"
        mac: "00:16:3e:10:01:02"
        ip: "192.168.1.102"
        subnet: "192.168.1.0/24"
        cpus: 4
        group: "webservers"

      # Static Kea reservation on VLAN 20
      - name: "db-01"
        mac: "00:16:3e:20:01:15"
        ip: "10.10.20.15"
        subnet: "10.10.20.0/24"
        network: "VLAN20-Backend"
        cpus: 8
        memory_mb: 16384
        disk_size_gb: 100
        group: "databases"

  children:
    dhcp_servers:
      hosts:
        kea-01.example.local:
          ansible_user: root

    provisioners:
      hosts:
        localhost:
          ansible_connection: local
          xcpng_host: "192.168.1.50"
          xcpng_user: "root"
          xcpng_pass: "your_secure_password"
          xcpng_validate_certs: false

